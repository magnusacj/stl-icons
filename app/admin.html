<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STL Icons dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
  :root { --navy: #282f4c; --orange: #f39100; --red: #e2051c; --grey: #5e6378; --light: #f4f4f4; --border: #e1e3e8; }
  * { box-sizing: border-box; margin: 0; }
  body { font: 14px 'Roboto', 'Segoe UI', sans-serif; color: var(--navy); background: var(--light); }
  header { background: var(--navy); color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
  header img { height: 20px; }
  header h1 { font: 400 18px 'PT Sans', sans-serif; border-left: 1px solid rgba(255,255,255,.4); padding-left: 12px; }
  header button { margin-left: auto; }
  main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
  .tabs button, button.btn { border: 1px solid var(--border); background: #fff; color: var(--navy); border-radius: 4px; padding: 8px 14px; font: inherit; cursor: pointer; }
  .tabs button.active, button.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--grey); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .kind { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; background: #fde8c8; }
  .kind.remove { background: #fadadd; }
  .kind.no_results { background: #d3dce6; }
  .zero { color: var(--red); font-weight: 500; }
  .muted { color: var(--grey); }
  input[type=email] { padding: 9px 12px; border: 1px solid var(--border); border-radius: 4px; font: inherit; width: 280px; max-width: 100%; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .hidden { display: none !important; }
  code { background: var(--light); padding: 1px 5px; border-radius: 3px; }
</style>
</head>
<body>
<header>
  <img src="assets/stl-logo-white.png" alt="STL Partners">
  <h1>Icons dashboard</h1>
  <button id="signOut" class="btn hidden">Sign out</button>
</header>
<main>
  <div id="notConfigured" class="card hidden">
    <h2>Not connected yet</h2>
    <p class="row">Fill in the Supabase address and public key in <code>app/config.js</code>, then publish.</p>
  </div>

  <div id="signIn" class="card hidden">
    <h2>Sign in</h2>
    <p class="row muted">Enter your STL Partners email. We'll send you a sign-in link.</p>
    <form id="signInForm" class="row">
      <input id="email" type="email" placeholder="name@stlpartners.com" required>
      <button class="btn primary" type="submit">Send link</button>
    </form>
    <p id="signInStatus" class="row muted"></p>
  </div>

  <div id="dashboard" class="hidden">
    <div class="tabs">
      <button data-tab="requests" class="active">Requests &amp; reports</button>
      <button data-tab="votes">Icon votes</button>
      <button data-tab="usage">Most used</button>
      <button data-tab="searches">Searches</button>
    </div>
    <div class="card"><div id="content">Loading…</div></div>
  </div>
</main>

<script>
const cfg = window.STL_FEEDBACK_CONFIG || {};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const date = s => s ? new Date(s).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' }) : '';
const show = (id, on) => document.getElementById(id).classList.toggle('hidden', !on);
const KIND_LABEL = { request: 'Request', no_results: 'Nothing found', remove: 'Remove icon' };

if (!cfg.url || !cfg.anonKey) {
    show('notConfigured', true);
} else {
    const db = supabase.createClient(cfg.url, cfg.anonKey);

    async function render(tab) {
        document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
        const content = document.getElementById('content');
        content.textContent = 'Loading…';
        const views = {
            requests: async () => {
                const { data, error } = await db.from('feedback').select('*')
                    .in('kind', ['request', 'no_results', 'remove']).order('created_at', { ascending: false }).limit(500);
                if (error) throw error;
                if (!data.length) return '<p class="muted">No requests yet.</p>';
                return '<table><tr><th>When</th><th>Type</th><th>Icon / search</th><th>Message</th><th>From</th></tr>' +
                    data.map(r => `<tr><td>${date(r.created_at)}</td><td><span class="kind ${r.kind}">${KIND_LABEL[r.kind]}</span></td>` +
                        `<td>${esc(r.icon_title || r.icon_key || (r.query ? '“' + r.query + '”' : ''))}</td><td>${esc(r.message)}</td>` +
                        `<td class="muted">${esc(r.name)}</td></tr>`).join('') + '</table>';
            },
            votes: async () => {
                const { data, error } = await db.from('icon_votes').select('*').limit(1000);
                if (error) throw error;
                if (!data.length) return '<p class="muted">No votes yet.</p>';
                data.sort((a, b) => (b.thumbs_up - b.thumbs_down) - (a.thumbs_up - a.thumbs_down));
                return '<table><tr><th>Icon</th><th class="num">👍</th><th class="num">👎</th><th class="num">Removal requests</th></tr>' +
                    data.map(r => `<tr><td>${esc(r.icon_title)} <span class="muted">${esc(r.icon_key)}</span></td>` +
                        `<td class="num">${r.thumbs_up}</td><td class="num">${r.thumbs_down}</td><td class="num">${r.removal_requests}</td></tr>`).join('') + '</table>';
            },
            usage: async () => {
                const { data, error } = await db.from('icon_usage').select('*').order('inserts', { ascending: false }).limit(200);
                if (error) throw error;
                if (!data.length) return '<p class="muted">No icons inserted yet.</p>';
                return '<table><tr><th>Icon</th><th class="num">Times inserted</th><th>Last used</th></tr>' +
                    data.map(r => `<tr><td>${esc(r.icon_title)} <span class="muted">${esc(r.icon_key)}</span></td>` +
                        `<td class="num">${r.inserts}</td><td>${date(r.last_used)}</td></tr>`).join('') + '</table>';
            },
            searches: async () => {
                const { data, error } = await db.from('search_terms').select('*').order('searches', { ascending: false }).limit(300);
                if (error) throw error;
                if (!data.length) return '<p class="muted">No searches yet.</p>';
                return '<p class="muted" style="margin-bottom:10px">Searches that found nothing are in red: good candidates for new icons.</p>' +
                    '<table><tr><th>Search</th><th class="num">Times</th><th class="num">Fewest results</th><th>Last searched</th></tr>' +
                    data.map(r => `<tr><td class="${r.fewest_results === 0 ? 'zero' : ''}">${esc(r.query)}</td><td class="num">${r.searches}</td>` +
                        `<td class="num ${r.fewest_results === 0 ? 'zero' : ''}">${r.fewest_results ?? ''}</td><td>${date(r.last_searched)}</td></tr>`).join('') + '</table>';
            }
        };
        try {
            content.innerHTML = await views[tab]();
        } catch (e) {
            content.innerHTML = `<p class="zero">Could not load: ${esc(e.message)}</p>`;
        }
    }

    async function start() {
        const { data: { session } } = await db.auth.getSession();
        const email = session?.user?.email || '';
        show('signIn', !session);
        show('dashboard', !!session);
        show('signOut', !!session);
        if (session && !/@stlpartners\.com$/i.test(email)) {
            document.getElementById('content').innerHTML = `<p class="zero">${esc(email)} is not an STL Partners address, so there is nothing to show.</p>`;
            return;
        }
        if (session) render('requests');
    }

    document.getElementById('signInForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const status = document.getElementById('signInStatus');
        const { error } = await db.auth.signInWithOtp({ email, options: { emailRedirectTo: location.href.split('#')[0] } });
        status.textContent = error ? `Could not send the link: ${error.message}` : `Check ${email} for a sign-in link.`;
    });
    document.getElementById('signOut').addEventListener('click', async () => { await db.auth.signOut(); start(); });
    document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => render(b.dataset.tab)));
    db.auth.onAuthStateChange(() => start());
    start();
}
</script>
</body>
</html>
